<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>pgrubic online</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <header class="top-bar">
      <div class="brand">
        <img class="logo" src="/assets/logo.png" alt="" />
        <div class="logo-section">
          <h1 class="main-title">pgrubic online</h1>
          <span class="sub-title"
            >An in-browser version of
            <a pgrubic-repo href="" target="_blank" rel="noopener noreferrer">
              <b>pgrubic</b>
            </a>
          </span>
        </div>
      </div>

      <button
        id="hamburger"
        class="hamburger"
        type="button"
        aria-label="Open menu"
        aria-controls="top-links"
        aria-expanded="false"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <nav class="top-links" id="top-links" aria-label="Primary navigation">
        <span id="pgrubicVersion" class="pgrubic-version">Loading...</span>

        <a pgrubic-repo href="" target="_blank" rel="noopener noreferrer"
          ><i class="fab fa-github"></i> GitHub
        </a>
        <a
          pgrubic-docs="rules"
          href=""
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fas fa-book"></i> Rules
        </a>
        <a
          pgrubic-docs="formatter"
          href=""
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fas fa-broom"></i> Format
        </a>
        <a
          pgrubic-docs="linter"
          href=""
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fas fa-shield-alt"></i> Lint
        </a>
        <a
          pgrubic-docs="settings"
          href=""
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fas fa-cog"></i> Config
        </a>

        <button class="share-btn" id="shareBtn" type="button">
          <i class="fa fa-share-alt"></i> Share
        </button>
      </nav>
    </header>

    <main class="main-container">
      <section class="config-panel" aria-labelledby="configHeading">
        <div class="config-header">
          <h2 id="configHeading">Configuration</h2>
          <span id="configSaveStatus" class="save-status" aria-live="polite"
            >Loaded</span
          >
        </div>
        <div class="config-editor" id="configEditor"></div>
        <div class="reset-config-container">
          <button class="reset-config-btn" id="resetConfigBtn" type="button">
            Restore default settings
          </button>
        </div>
      </section>

      <section class="editor-section" aria-labelledby="sqlHeading">
        <div class="sql-editor-box">
          <div class="editor-container">
            <div class="editor-header">
              <h2 id="sqlHeading">Paste your SQL here</h2>
              <span id="sqlSaveStatus" class="save-status" aria-live="polite"
                >Loaded</span
              >
            </div>
            <div class="sql-editor" id="sqlEditor"></div>
          </div>
          <div class="sql-output-box-container">
            <div id="sqlOutputBox" class="sql-output-box" style="display: none">
              <div class="flex justify-between">
                <label class="editor-header" id="sqlOutputLabel"
                  >Fixed SQL</label
                >
                <button
                  class="copy-btn"
                  id="copyBtn"
                  type="button"
                  aria-label="Copy output"
                  title="Copy output"
                >
                  <i class="fas fa-copy"></i>
                </button>
              </div>
              <div id="sqlOutput" class="sql-editor"></div>
            </div>
          </div>
        </div>
        <div class="action-buttons">
          <button class="action-btn format-btn" id="formatBtn" type="button">
            Format SQL
          </button>
          <button class="action-btn lint-btn" id="lintBtn" type="button">
            Check SQL
          </button>
          <button class="action-btn lint-fix-btn" id="lintFixBtn" type="button">
            Check &amp; fix
          </button>
        </div>
        <span class="flex">
          <span
            class="lint-violations-summary p-4"
            id="lintViolationsSummary"
            aria-live="polite"
          ></span>
        </span>
        <div class="lint-output" id="lintOutput" aria-live="polite"></div>
      </section>
    </main>

    <div id="notifications" class="notifications" aria-live="polite"></div>

    <script src="/config.js"></script>
    <script type="module" src="src/main.js" defer></script>
  </body>
</html>
